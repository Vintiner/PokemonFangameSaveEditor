services:
  - type: web
    name: rxdata-save-editor
    runtime: ruby
    plan: free
    buildCommand: bundle install
    startCommand: bundle exec puma -C config/puma.rb
    healthCheckPath: /
    envVars:
      - key: RAILS_ENV
        value: production
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: RAILS_MAX_THREADS
        value: "5"
      # Uploaded saves live on the instance's own disk for the length of an
      # editing session, so the app expects to run as a single instance.
      - key: WEB_CONCURRENCY
        value: "0"
